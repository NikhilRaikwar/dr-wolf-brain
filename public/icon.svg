<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="walnutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2215"/>
      <stop offset="100%" stop-color="#180e07"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d38a"/>
      <stop offset="50%" stop-color="#c98a36"/>
      <stop offset="100%" stop-color="#8a5014"/>
    </linearGradient>
    <linearGradient id="ivoryKnight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#eedcbe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base with Antique Gold Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#walnutBg)" stroke="url(#goldBorder)" stroke-width="2.5" />
  
  <!-- Subtle Inner Inset Border -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="11" fill="none" stroke="#633b21" stroke-width="1" stroke-opacity="0.6" />

  <!-- Chess Knight Figure (Scaled & Centered for Favicon Clarity) -->
  <g transform="translate(9.5, 7.5) scale(1.0)" filter="url(#shadow)">
    <!-- Base Body of Knight -->
    <path fill="url(#ivoryKnight)" stroke="#2b160b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
      d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21 Z" />
    
    <!-- Head & Muzzle of Knight / Wolf-Knight -->
    <path fill="url(#ivoryKnight)" stroke="#2b160b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
      d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3 Z" />

    <!-- Eye & Mane Details -->
    <circle cx="9.5" cy="25.5" r="1.3" fill="#2b160b" />
    <circle cx="10" cy="25.2" r="0.4" fill="#ffffff" />
    <path d="M14.5 15.8 C14.5 15 15.5 15 15.5 15.8 C15.5 16.6 14.5 16.6 14.5 15.8 Z" fill="#2b160b" />
    
    <!-- Gold Mane Contour Accent -->
    <path d="M24.5 11.5 C30 13.5 34.5 18 34.5 37" fill="none" stroke="#d89b3f" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>