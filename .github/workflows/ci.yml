name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Full CI Verification (PostgreSQL, Stockfish, Pytest, Next.js)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wolf
          POSTGRES_PASSWORD: wolf
          POSTGRES_DB: wolfbrain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic migration against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://wolf:wolf@localhost:5432/wolfbrain_test
        run: |
          cd backend
          alembic upgrade head
          cd ..

      - name: Run Backend Pytest Suite (Unit + PostgreSQL Concurrency)
        env:
          DATABASE_URL: postgresql+psycopg2://wolf:wolf@localhost:5432/wolfbrain_test
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg2://wolf:wolf@localhost:5432/wolfbrain_test
          STOCKFISH_PATH: /usr/games/stockfish
        run: pytest backend/tests -v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Verify TypeScript types
        run: npm run typecheck

      - name: Verify chess positions and legality
        run: npm run verify:chess

      - name: Build production Next.js app
        run: npm run build
